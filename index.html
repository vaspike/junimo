<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="keywords"
      content="junimo, Junimo, server monitor, real-time server status, server performance dashboard, monitoring tool" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Junimo" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.ico" />
    <meta property="og:title" content="lumina-pro" />
    <meta property="og:description" content="A Komari monitor theme." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="lumina-pro" />
    <meta name="twitter:description" content="A Komari monitor theme." />
    <title>lumina-pro</title>
    <meta name="description" content="A Komari monitor theme." />
    <script>
      (() => {
        const appearances = new Set(["system", "light", "dark", "farm"]);
        const readAppearance = (key) => {
          const raw = localStorage.getItem(key);
          if (raw == null) return null;
          let value = raw;
          try {
            value = JSON.parse(raw);
          } catch {}
          if (!appearances.has(value)) return null;
          const normalized = JSON.stringify(value);
          if (raw !== normalized) localStorage.setItem(key, normalized);
          return value;
        };

        let appearance = "system";
        try {
          appearance = readAppearance("appearance") ?? readAppearance("appearance_default") ?? "system";
        } catch {
          appearance = "system";
        }
        const resolved =
          appearance === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        document.documentElement.dataset.appearance = resolved;
        // farm 主题的昼/夕场景按本地时间（6:00–18:00 为昼）划分，季节按真实月份，
        // 与 usePreferences 保持一致。
        let farmScene = null;
        if (resolved === "farm") {
          const now = new Date();
          const hour = now.getHours();
          farmScene = hour >= 6 && hour < 18 ? "day" : "dusk";
          document.documentElement.dataset.farmScene = farmScene;
          const month = now.getMonth();
          document.documentElement.dataset.farmSeason =
            month >= 2 && month <= 4
              ? "spring"
              : month >= 5 && month <= 7
                ? "summer"
                : month >= 8 && month <= 10
                  ? "autumn"
                  : "winter";
        }
        document.documentElement.style.colorScheme = resolved === "dark" ? "dark" : "light";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.content =
            resolved === "dark"
              ? "#000000"
              : resolved === "farm"
                ? farmScene === "dusk"
                  ? "#2c2450"
                  : "#63b4e6"
                : "#F5F5F7";
        }

        try {
          const rawDepth = localStorage.getItem("komaritheme:dark-depth");
          if (rawDepth != null) {
            const parsedDepth = Number(rawDepth);
            const darkDepth = Number.isFinite(parsedDepth)
              ? Math.min(100, Math.max(0, Math.round(parsedDepth)))
              : 0;
            if (darkDepth > 0) {
              document.documentElement.style.setProperty(
                "--dark-depth",
                String(darkDepth),
              );
            } else {
              document.documentElement.style.removeProperty("--dark-depth");
            }
          }
        } catch {}

        try {
          const rawBg = localStorage.getItem("komaritheme:bg");
          if (rawBg) {
            const bg = JSON.parse(rawBg);
            if (bg && bg.v === 1 && !(resolved === "farm" && bg.farm === false)) {
              const sizes = new Set(["cover", "contain", "auto"]);
              const positions = new Set(["top", "center", "bottom"]);
              const parseImage = (value) =>
                typeof value === "string" &&
                (value === "none" || /^url\("[^\"'`()<>\\\s]+"\)$/.test(value))
                  ? value
                  : null;
              // farm 的「浅色|深色」双图映射到昼/夕场景（与 applyBackgroundCache 一致）。
              const dark =
                resolved === "dark" || (resolved === "farm" && farmScene === "dusk");
              const desktop = parseImage(dark ? bg.darkDesktop : bg.lightDesktop) ?? "none";
              const mobile = parseImage(dark ? bg.darkMobile : bg.lightMobile) ?? desktop;
              const parsedAlpha =
                (typeof bg.alpha === "string" && bg.alpha.trim() !== "") ||
                typeof bg.alpha === "number"
                  ? Number(bg.alpha)
                  : Number.NaN;
              const alpha = Number.isFinite(parsedAlpha)
                ? Math.min(100, Math.max(0, Math.round(parsedAlpha)))
                : 100;
              const scrim = alpha >= 95 ? 0 : Math.round(((95 - alpha) / 95) * 16);
              const style = document.documentElement.style;
              style.setProperty("--bg-image-desktop", desktop);
              style.setProperty("--bg-image-mobile", mobile);
              style.setProperty("--bg-size", sizes.has(bg.size) ? bg.size : "cover");
              style.setProperty("--bg-position", positions.has(bg.position) ? bg.position : "center");
              style.setProperty("--surface-alpha", String(alpha));
              if (scrim > 0) {
                style.setProperty(
                  "--bg-scrim",
                  `color-mix(in srgb, var(--bg-0) ${scrim}%, transparent)`,
                );
              } else {
                style.removeProperty("--bg-scrim");
              }
              // farm 主题据此关闭程序化场景（与 applyBackgroundCache 一致）。
              document.documentElement.dataset.bgImage = "1";
            }
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root" class="relative z-30"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
